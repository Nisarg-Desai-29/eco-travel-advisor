# OPTIONAL: DistilBERT variant for the latency / accuracy comparison in the report.
# NOTE: the brief mentions HFTransformersNLP. That component belongs to Rasa 2.x.
# In Rasa 3.x the same idea is LanguageModelFeaturizer (below).
# Install first:  pip install "rasa[transformers]==3.6.*"
# Train with:     rasa train --config config_distilbert.yml --fixed-model-name distilbert
recipe: default.v1
language: en
assistant_id: eco-travel-advisor-distilbert

pipeline:
  - name: WhitespaceTokenizer
  - name: LanguageModelFeaturizer
    model_name: distilbert
    model_weights: distilbert-base-uncased
  - name: RegexFeaturizer
  - name: LexicalSyntacticFeaturizer
  - name: DIETClassifier
    epochs: 100
    constrain_similarities: true
  - name: EntitySynonymMapper
  - name: FallbackClassifier
    threshold: 0.5
    ambiguity_threshold: 0.1

policies:
  - name: MemoizationPolicy
  - name: RulePolicy
    core_fallback_threshold: 0.3
    core_fallback_action_name: action_default_fallback
    enable_fallback_prediction: true
  - name: TEDPolicy
    max_history: 5
    epochs: 100
    constrain_similarities: true
