version: "3.1"

rules:

- rule: start trip form on plan_trip
  steps:
    - intent: plan_trip
    - action: trip_form
    - active_loop: trip_form

- rule: start trip form on inform_destination
  steps:
    - intent: inform_destination
    - action: trip_form
    - active_loop: trip_form

- rule: start trip form on inform_origin
  steps:
    - intent: inform_origin
    - action: trip_form
    - active_loop: trip_form

- rule: start trip form on inform_dates
  steps:
    - intent: inform_dates
    - action: trip_form
    - active_loop: trip_form

- rule: start trip form on inform_budget
  steps:
    - intent: inform_budget
    - action: trip_form
    - active_loop: trip_form

- rule: start trip form on inform_sustainability_level
  steps:
    - intent: inform_sustainability_level
    - action: trip_form
    - active_loop: trip_form

- rule: start trip form on ask_carbon_footprint
  steps:
    - intent: ask_carbon_footprint
    - action: trip_form
    - active_loop: trip_form

- rule: start trip form on ask_eco_hotels
  steps:
    - intent: ask_eco_hotels
    - action: trip_form
    - active_loop: trip_form

- rule: submit trip form and show results
  condition:
    - active_loop: trip_form
  steps:
    - action: trip_form
    - active_loop: null
    - slot_was_set:
        - requested_slot: null
    - action: action_fetch_carbon_footprint
    - action: action_fetch_eco_hotels
    - action: action_rank_options
    - action: utter_anything_else

- rule: stop the form
  condition:
    - active_loop: trip_form
  steps:
    - intent: stop
    - action: action_deactivate_loop
    - active_loop: null
    - slot_was_set:
        - requested_slot: null
    - action: utter_stopped

- rule: stop outside a form
  condition:
    - active_loop: null
  steps:
    - intent: stop
    - action: utter_stopped

- rule: explain CO2e inside the form, then continue
  condition:
    - active_loop: trip_form
  steps:
    - intent: explain_co2e
    - action: utter_explain_co2e
    - action: trip_form
    - active_loop: trip_form

- rule: explain CO2e outside a form
  condition:
    - active_loop: null
  steps:
    - intent: explain_co2e
    - action: utter_explain_co2e

- rule: privacy inside the form, then continue
  condition:
    - active_loop: trip_form
  steps:
    - intent: ask_privacy
    - action: utter_privacy
    - action: trip_form
    - active_loop: trip_form

- rule: privacy outside a form
  condition:
    - active_loop: null
  steps:
    - intent: ask_privacy
    - action: utter_privacy

- rule: unclear answer inside the form is handled by the form
  condition:
    - active_loop: trip_form
  steps:
    - intent: nlu_fallback
    - action: trip_form
    - active_loop: trip_form

- rule: two-stage fallback outside a form
  condition:
    - active_loop: null
  steps:
    - intent: nlu_fallback
    - action: action_default_fallback

- rule: greet
  steps:
    - intent: greet
    - action: utter_greet

- rule: goodbye
  steps:
    - intent: goodbye
    - action: utter_goodbye

- rule: thanks
  steps:
    - intent: thanks
    - action: utter_thanks

- rule: bot challenge
  steps:
    - intent: bot_challenge
    - action: utter_iamabot

- rule: out of scope
  steps:
    - intent: out_of_scope
    - action: utter_out_of_scope

- rule: delete my data
  steps:
    - intent: delete_my_data
    - action: utter_data_deleted
    - action: action_restart

- rule: human advisor
  steps:
    - intent: request_human_advisor
    - action: action_human_handover

- rule: offsets
  steps:
    - intent: ask_offsets
    - action: action_show_offsets

- rule: local experiences
  steps:
    - intent: ask_experiences
    - action: action_fetch_experiences
